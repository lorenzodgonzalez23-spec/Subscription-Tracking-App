name: subglass
description: A private, local-first subscription tracker.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  drift: ^2.18.0
  drift_flutter: ^0.3.1
  path_provider: ^2.1.3
  path: ^1.9.0
  file_picker: ^8.0.0
  fl_chart: ^0.68.0
  http: ^1.2.1
  shared_preferences: ^2.2.3
  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.3
  archive: ^3.6.1
  csv: ^6.0.0
  intl: ^0.19.0
  uuid: ^4.4.0
  image: ^4.2.0
  web: ^1.1.2
  cupertino_icons: ^1.0.8
  flutter_timezone: 5.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
